# 推到 main 時自動 build 並部署到 Firebase Hosting（wattwise 與 main 兩個網站）
# 需要 repo secret：FIREBASE_SERVICE_ACCOUNT（Firebase 專案設定 → 服務帳戶 → 產生新的私密金鑰，貼上整份 JSON）
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ev-tracker-119e6
          channelId: live
